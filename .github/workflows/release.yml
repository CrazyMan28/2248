name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Grant Gradle execute
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK artifact
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SHORT_SHA="${GITHUB_SHA::7}"
          NAME="TRACE-${VERSION}-${SHORT_SHA}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          cp "$SRC" "dist/TRACE-latest.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRACE-apk
          path: dist/*.apk

      - name: Publish GitHub Release (sideload)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sideload-${{ github.run_number }}
          name: TRACE sideload #${{ github.run_number }}
          body: |
            ## Install on your phone

            1. On your Android phone, open this release page (or the repo **Releases** → Latest)
            2. Download **TRACE-latest.apk**
            3. If prompted, allow install from the browser / Files
            4. Tap Install → Open TRACE

            Built from `main` @ `${{ github.sha }}`.

            Note: signed with the debug key for easy sideload (not Play Store).
          files: |
            dist/TRACE-latest.apk
            ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
